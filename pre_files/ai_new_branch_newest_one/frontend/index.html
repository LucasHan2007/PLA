<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 编程 IDE</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="app">
    <section id="login-view" class="login-view">
      <form id="auth-form" class="auth-card">
        <h1>AI 编程 IDE</h1>
        <div class="auth-tabs">
          <button type="button" id="auth-tab-login" class="active">登录</button>
          <button type="button" id="auth-tab-register">注册</button>
        </div>
        <label>用户名<input id="auth-username" autocomplete="username" /></label>
        <label>密码<input id="auth-password" type="password" autocomplete="current-password" /></label>
        <label id="auth-provider-wrap" class="hidden">API 供应商
          <select id="auth-provider"></select>
        </label>
        <label id="auth-apikey-wrap" class="hidden">API Key<input id="auth-apikey" type="password" autocomplete="off" /></label>
        <label id="auth-apiurl-wrap" class="hidden">自定义 API 地址<input id="auth-apiurl" placeholder="选其他时填写" /></label>
        <button class="primary" type="submit" id="auth-submit">登录</button>
        <button id="admin-login" type="button">管理员一键登录</button>
        <p class="message" id="auth-message"></p>
      </form>
    </section>

    <section id="workspace-view" class="workspace-view hidden">
      <aside class="sidebar">
        <div class="account">
          <strong id="account-username"></strong>
          <span id="account-meta"></span>
          <button title="退出登录" id="logout-btn">退出</button>
        </div>
        <nav class="side-tabs">
          <button id="tab-tree" class="active">Explorer</button>
          <button id="tab-project">Project</button>
          <button id="tab-settings">Settings</button>
        </nav>

        <section id="panel-tree" class="side-panel active">
          <div class="toolbar-row">
            <button id="btn-new-chat">新对话</button>
            <button id="btn-clear-node">清空</button>
          </div>
          <div class="tree-list" id="tree-list"></div>
          <div class="toolbar-row">
            <button id="btn-export">导出</button>
            <label class="file-btn">导入<input type="file" id="btn-import" accept="application/json" /></label>
          </div>
        </section>

        <section id="panel-project" class="side-panel">
          <div class="panel-heading">
            <h3>项目规划</h3>
            <button type="button" id="btn-refresh-scaffold">刷新</button>
          </div>
          <div class="project-plan muted" id="project-plan">暂无项目规划</div>
          <div class="panel-heading">
            <h3>内部图谱</h3>
            <div class="panel-heading-actions">
              <button type="button" id="btn-visualize-lkg">可视化</button>
              <button type="button" id="btn-manage-lkg">管理</button>
            </div>
          </div>
          <div class="knowledge-list" id="knowledge-list">
            <span class="muted">暂无内部图谱</span>
          </div>
          <div id="lkg-manager" class="lkg-manager hidden">
            <div class="lkg-toolbar">
              <button type="button" id="lkg-select-all">全选</button>
              <button type="button" id="lkg-batch-delete">批量删除</button>
              <button type="button" id="lkg-add">添加</button>
              <button type="button" id="lkg-exit">退出管理</button>
            </div>
            <form id="lkg-form" class="lkg-form hidden">
              <input type="text" id="lkg-name" placeholder="知识点名称" />
              <input type="text" id="lkg-desc" placeholder="描述" />
              <input type="number" id="lkg-weight" placeholder="熟悉度" step="0.1" min="0" max="1" />
              <button type="submit" class="primary" id="lkg-save">保存</button>
              <button type="button" id="lkg-cancel">取消</button>
            </form>
            <div class="lkg-list" id="lkg-edit-list"></div>
          </div>
        </section>

        <section id="panel-settings" class="side-panel">
          <label>回答风格
            <select id="setting-prompt-mode"></select>
          </label>
          <label>模型
            <select id="setting-model"></select>
          </label>
          <label>语言
            <select id="setting-language"></select>
          </label>
        </section>
      </aside>

      <section class="editor-area">
        <div class="editor-toolbar">
          <strong id="file-name">solution.py</strong>
          <button id="btn-send-code">发送给 AI</button>
          <button id="btn-clear-code">清空</button>
          <button id="btn-copy-code">复制</button>
          <button id="btn-check-syntax">检查语法</button>
          <button class="primary" id="btn-save">保存</button>
        </div>
        <div id="editor"></div>
      </section>

      <section class="chat-area">
        <header>对话</header>
        <div id="chat-list" class="chat-list"></div>
        <form class="chat-form" id="chat-form">
          <div class="chat-input-wrapper">
            <div id="file-list" class="file-list hidden"></div>
            <textarea id="chat-input" rows="1" placeholder="向 AI 提问，可请求检查或修改左侧代码…"></textarea>
            <div class="chat-input-toolbar">
              <input type="file" id="chat-file-input" class="hidden" multiple accept=".txt,.py,.js,.cpp,.java,.md,.json,.html,.css,.xml,.yaml,.yml,.c,.h,.hpp,.ts,.jsx,.tsx" />
              <label class="file-attach-btn" for="chat-file-input" id="chat-attach" title="上传文本文件">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/><line x1="12" y1="2" x2="12" y2="2"/></svg>
                <span class="attach-text">上传</span>
              </label>
              <button class="send-btn" type="button" id="chat-send"></button>
            </div>
          </div>
        </form>
      </section>

      <footer class="status-bar">
        <span id="status-lang">Python</span>
        <span id="status-model"></span>
      </footer>
    </section>

    <div id="selection-menu" class="selection-menu hidden">
      <button type="button" id="sel-branch">以选中文本创建分支</button>
      <button type="button" id="sel-ask">用选中文本提问</button>
      <button type="button" id="sel-copy">复制选中文本</button>
      <button type="button" id="sel-replace">覆盖到代码区</button>
      <button type="button" id="sel-append">追加到代码区</button>
    </div>
  </main>

  <div id="lkg-viz-modal" class="modal hidden" tabindex="-1">
    <div class="modal-backdrop" id="lkg-viz-backdrop"></div>
    <div class="modal-dialog modal-xl">
      <div class="modal-header">
        <h3>内部知识图谱可视化</h3>
        <button type="button" id="lkg-viz-close" class="modal-close" title="关闭">×</button>
      </div>
      <div class="modal-body">
        <div id="lkg-viz-cy"></div>
        <div id="lkg-viz-sidebar" class="viz-sidebar">
          <div class="viz-placeholder">点击节点查看详情</div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="lkg-viz-reset">重置视图</button>
        <button type="button" id="lkg-viz-fit">适配屏幕</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <script src="./main.js"></script>
</body>
</html>
